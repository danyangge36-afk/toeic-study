<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="manifest.json">
<title>TOEIC 高分学习助手</title>
<style>
:root {
  --bg: #f4f6fc;
  --card: #ffffff;
  --ink: #182035;
  --muted: #69748c;
  --line: #e4e8f4;
  --brand: #3b5bdb;
  --brand-2: #7048e8;
  --brand-soft: #edf0ff;
  --good: #0ca678;
  --good-soft: #e6faf3;
  --bad: #e03131;
  --bad-soft: #ffeaea;
  --warn: #f59f00;
  --shadow: 0 1px 2px rgba(24,32,53,.04), 0 10px 28px -14px rgba(24,32,53,.14);
  --shadow-brand: 0 8px 20px -8px rgba(59,91,219,.45);
  --radius: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px; line-height: 1.65;
  background:
    radial-gradient(1100px 420px at 15% -8%, #e3eaff 0%, transparent 58%),
    radial-gradient(900px 380px at 92% -12%, #f1e6ff 0%, transparent 55%),
    var(--bg);
  min-height: 100vh;
}
::selection { background: rgba(59,91,219,.18); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #c7d0e8; border-radius: 99px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #aab7dc; }

header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  box-shadow: 0 1px 0 rgba(24,32,53,.05), 0 8px 24px -18px rgba(24,32,53,.25);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.logo { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
.logo-badge {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; letter-spacing: .3px;
  box-shadow: var(--shadow-brand);
}
.logo-text {
  font-weight: 800; font-size: 16.5px; letter-spacing: .2px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-btn {
  border: none; background: transparent; padding: 7px 13px; border-radius: 999px;
  font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--muted); font-family: inherit;
  transition: .16s;
}
.nav-btn:hover { color: var(--brand); background: var(--brand-soft); }
.nav-btn.active {
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff;
  box-shadow: 0 4px 12px -4px rgba(59,91,219,.55);
}
#themeBtn {
  margin-left: auto; width: 36px; height: 36px; padding: 0; font-size: 15px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer;
  transition: .16s; display: flex; align-items: center; justify-content: center;
}
#themeBtn:hover { border-color: var(--brand); transform: rotate(14deg); }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
#view { animation: fadeUp .3s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.hero {
  position: relative; overflow: hidden;
  border-radius: 22px; padding: 34px 30px; margin-bottom: 18px;
  background: linear-gradient(120deg, #3b5bdb 0%, #7048e8 55%, #9c36b5 110%);
  color: #fff; box-shadow: 0 18px 40px -18px rgba(83, 82, 219, .55);
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(620px 220px at 88% -10%, rgba(255,255,255,.28), transparent 62%),
    radial-gradient(420px 180px at 6% 115%, rgba(255,255,255,.16), transparent 60%);
}
.hero h1 { margin: 0 0 8px; font-size: 29px; letter-spacing: .4px; position: relative; }
.hero p { margin: 0; opacity: .92; font-size: 14.5px; position: relative; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow);
  transition: box-shadow .22s, transform .22s;
}
.card:hover { box-shadow: 0 2px 4px rgba(24,32,53,.04), 0 18px 44px -18px rgba(24,32,53,.2); }
.card h3 { margin: 0 0 12px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.card h4 { margin: 16px 0 6px; font-size: 14.5px; color: var(--brand); }
.card.note { background: linear-gradient(135deg, #fffdf4, #fffaf0); border-color: #f1e5bb; }
.page-head { margin: 6px 2px 16px; }
.page-head h1 { margin: 0; font-size: 23px; letter-spacing: .2px; }
.page-head p { margin: 5px 0 0; }
.muted { color: var(--muted); font-size: 13px; }
.lbl { display: block; margin: 13px 0 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .3px; }
.center { text-align: center; }

.btn {
  display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 9px 16px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 500; font-family: inherit;
  transition: .16s;
}
.btn:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); box-shadow: 0 8px 18px -10px rgba(59,91,219,.45); }
.btn:active { transform: translateY(0); }
.btn.big { display: block; width: 100%; text-align: left; margin-bottom: 9px; font-size: 14.5px; padding: 12px 15px; border-radius: 13px; }
.btn.sm { padding: 4px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.primary {
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); border: none; color: #fff;
  box-shadow: var(--shadow-brand);
}
.btn.primary:hover { color: #fff; transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(83,82,219,.6); }
.btn.good { background: linear-gradient(135deg, #0ca678, #099268); border: none; color: #fff; }
.btn.bad { background: linear-gradient(135deg, #f03e3e, #e03131); border: none; color: #fff; }
.btn.danger { color: var(--bad); border-color: #f3c6c6; background: transparent; }
.btn.danger:hover { border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.icon-btn { border: none; background: var(--brand-soft); border-radius: 9px; cursor: pointer; padding: 3px 9px; font-size: 14px; transition: .15s; }
.icon-btn:hover { transform: scale(1.08); }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; color: var(--ink);
  transition: .15s;
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip.active {
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent; color: #fff;
  box-shadow: 0 4px 10px -4px rgba(59,91,219,.5);
}

input[type=date], input[type=range], select, textarea {
  width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 11px;
  font-family: inherit; font-size: 14px; background: var(--card); color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3.5px rgba(59,91,219,.14); }
.countdown { margin-top: 14px; font-size: 15px; }
.countdown b {
  font-size: 22px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.countdown.over { color: var(--muted); }
.stat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.stat-row:last-of-type { border-bottom: none; }
.stat-row span:first-child { color: var(--muted); }
.progress { height: 9px; background: var(--brand-soft); border-radius: 99px; margin-top: 10px; overflow: hidden; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }

.flashcard { max-width: 660px; }
.fc-meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.fc-word { font-size: 31px; font-weight: 800; letter-spacing: .3px; margin: 8px 0 14px; }
.fc-pos { font-size: 13.5px; color: var(--muted); font-weight: 500; margin-left: 6px; }
.fc-meaning { background: var(--brand-soft); border-radius: 12px; padding: 13px 16px; margin: 10px 0; }
.fc-zh { font-size: 18px; font-weight: 700; }
.fc-ex { color: var(--muted); font-size: 14px; margin-top: 5px; font-style: italic; }

.opt {
  display: block; width: 100%; text-align: left; margin: 8px 0; padding: 11px 15px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer;
  font-size: 14.5px; font-family: inherit; color: var(--ink); transition: .14s;
}
.opt:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); transform: translateX(3px); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.picked { border-color: var(--brand); background: var(--brand-soft); }
.opt.speaking { border-color: var(--brand); background: var(--brand-soft); }
.opt:disabled { cursor: default; }

.explain {
  background: #f7f9fd; border-left: 3px solid var(--brand); border-radius: 8px;
  padding: 11px 13px; margin: 10px 0; font-size: 13.5px;
}
.photo-box {
  background: linear-gradient(135deg, #eef2ff, #f5f0ff); border: 1px dashed #b9c6f5; border-radius: 12px;
  padding: 13px 15px; margin: 10px 0 12px; font-size: 14px;
}
.passage {
  background: #f8faff; border: 1px solid var(--line); border-radius: 12px;
  padding: 15px 17px; margin: 10px 0; font-size: 14px; line-height: 1.75;
}
.passage p { margin: 4px 0; }
.transcript { background: #f6f7f1; border-radius: 12px; padding: 13px 15px; margin: 10px 0; font-size: 13.5px; }
.transcript p { margin: 3px 0; }
.q-block { margin: 15px 0 4px; }
.q-text { font-weight: 600; margin-bottom: 5px; }
.q-feed:empty { display: none; }

.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; margin: 8px 0; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 9px 11px; text-align: left; vertical-align: top; }
.tbl tr:first-child th { border-top: 1px solid var(--line); }
.tbl th { background: #f6f8fd; font-weight: 600; }
.tbl tr:first-child th:first-child { border-top-left-radius: 10px; }
.tbl tr:first-child th:last-child { border-top-right-radius: 10px; }
.tbl tr:last-child td:first-child { border-bottom-left-radius: 10px; }
.tbl tr:last-child td:last-child { border-bottom-right-radius: 10px; }
.tip-cell { color: var(--muted); font-size: 12.5px; }
.score-num {
  font-size: 46px; font-weight: 800; letter-spacing: -.5px;
  background: linear-gradient(120deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.score-num.total { background: linear-gradient(120deg, #7048e8, #9c36b5); -webkit-background-clip: text; background-clip: text; }

details.strategy { border: 1px solid var(--line); border-radius: 12px; padding: 11px 15px; margin: 9px 0; background: var(--card); transition: .15s; }
details.strategy:hover { border-color: #c5cfee; }
details.strategy summary { cursor: pointer; font-weight: 600; }
details.strategy ul { margin: 8px 0 2px; padding-left: 20px; }
details.strategy li { margin: 4px 0; }
.res-list { padding-left: 18px; margin: 6px 0; }
.res-list li { margin: 11px 0; }
.res-list a { color: var(--brand); font-weight: 600; text-decoration: none; }
.res-list a:hover { text-decoration: underline; }
details.wrong-item { border-bottom: 1px dashed var(--line); padding: 8px 2px; }
details.wrong-item summary { cursor: pointer; font-size: 14px; }
.mock-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: linear-gradient(120deg, #1b2440, #2b2a55); color: #fff; border-radius: var(--radius);
  padding: 12px 18px; margin-bottom: 14px; font-size: 14px;
  box-shadow: 0 14px 30px -16px rgba(27, 36, 64, .6);
}
.timer { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px 0 10px; }

.reco {
  background: linear-gradient(135deg, var(--brand-soft), #f3ecff);
  border: 1px solid #dfe4ff; border-radius: 12px; padding: 11px 13px; font-size: 13.5px; line-height: 1.6;
}
.mini-bar { display: inline-block; flex: 1; height: 8px; background: var(--brand-soft); border-radius: 99px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.badge { text-align: center; padding: 11px 4px; border: 1px solid var(--line); border-radius: 12px; opacity: .35; filter: grayscale(1); transition: .2s; }
.badge.on { opacity: 1; filter: none; background: linear-gradient(135deg, var(--brand-soft), #f3ecff); border-color: #c9d1ff; }
.badge span { font-size: 23px; display: block; }
.badge small { font-size: 11px; color: var(--muted); }
.dict-diff { line-height: 2.1; font-size: 14.5px; }
.w-miss { color: var(--bad); text-decoration: underline wavy; font-weight: 600; }
.w-extra { color: var(--warn); text-decoration: line-through; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.plan-item { display: flex; gap: 9px; align-items: flex-start; padding: 8px 2px; border-bottom: 1px dashed var(--line); cursor: pointer; border-radius: 6px; transition: background .15s; }
.plan-item:hover { background: var(--brand-soft); }
.plan-item:last-child { border-bottom: none; }
.plan-item input { width: auto; margin-top: 4px; accent-color: var(--brand); }
.plan-item input:checked + span { text-decoration: line-through; color: var(--muted); }
.challenge-flex { display: flex; align-items: center; gap: 18px; justify-content: space-between; flex-wrap: wrap; }
.challenge-flex p { margin: 0; color: var(--muted); font-size: 14px; }

/* ============ 深色模式 ============ */
.dark {
  --bg: #0d1120; --card: #151c2e; --ink: #e7ecf5; --muted: #93a0b8; --line: #29324a;
  --brand: #7d92ff; --brand-2: #a78bfa; --brand-soft: #1f2947;
  --good: #38d9a9; --good-soft: #10352a; --bad: #ff6b6b; --bad-soft: #3d1d1d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.5);
  --shadow-brand: 0 8px 20px -8px rgba(20, 26, 60, .8);
}
.dark body {
  background:
    radial-gradient(1100px 420px at 15% -8%, #16204a 0%, transparent 58%),
    radial-gradient(900px 380px at 92% -12%, #241a45 0%, transparent 55%),
    var(--bg);
}
.dark header { background: rgba(13, 17, 32, .8); box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 10px 26px -20px rgba(0,0,0,.8); }
.dark .btn, .dark .opt, .dark .chip { background: var(--card); color: var(--ink); border-color: var(--line); }
.dark .btn.primary { background: linear-gradient(135deg, #5470e6, #8b5cf6); border: none; color: #fff; box-shadow: 0 8px 20px -8px rgba(84, 112, 230, .5); }
.dark .btn.primary:hover { color: #fff; }
.dark .btn.good { background: linear-gradient(135deg, #0ca678, #099268); border: none; color: #fff; }
.dark .btn.bad { background: linear-gradient(135deg, #f03e3e, #e03131); border: none; color: #fff; }
.dark .btn:hover, .dark .chip:hover { border-color: var(--brand); color: var(--brand); }
.dark .btn.primary { color: #fff; }
.dark .opt:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
.dark .opt.correct { background: var(--good-soft); border-color: var(--good); }
.dark .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.dark .opt.picked, .dark .opt.speaking { background: var(--brand-soft); border-color: var(--brand); }
.dark input[type=date], .dark select, .dark textarea { background: var(--card); color: var(--ink); border-color: var(--line); }
.dark .explain { background: #1a2338; border-left-color: var(--brand); }
.dark .passage, .dark .transcript { background: #111a2e; border-color: var(--line); }
.dark .photo-box { background: linear-gradient(135deg, #1a2340, #221b40); border-color: #35426e; }
.dark .tbl th { background: #1a2338; }
.dark .tbl th, .dark .tbl td { border-color: var(--line); }
.dark .card.note { background: linear-gradient(135deg, #262012, #1f1d10); border-color: #4d411c; }
.dark .mock-bar { background: linear-gradient(120deg, #0c1226, #171433); box-shadow: 0 14px 30px -18px rgba(0,0,0,.8); }
.dark .stat-row { border-color: var(--line); }
.dark details.strategy { background: var(--card); border-color: var(--line); }
.dark details.strategy:hover { border-color: #3a4569; }
.dark .reco { background: linear-gradient(135deg, var(--brand-soft), #241c45); border-color: #35426e; }
.dark .badge.on { background: linear-gradient(135deg, var(--brand-soft), #241c45); border-color: #3a4569; }
.dark ::-webkit-scrollbar-thumb { background: #2a3346; }
.dark ::-webkit-scrollbar-thumb:hover { background: #3a4569; }
.dark ::-webkit-scrollbar-thumb { border-color: var(--bg); }
.dark .btn.danger { background: transparent; }
.dark .icon-btn { background: var(--brand-soft); }

@media (max-width: 640px) {
  .fc-word { font-size: 25px; }
  header { padding: 8px 10px; }
  .hero { padding: 26px 20px; }
  .hero h1 { font-size: 24px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <span class="logo"><span class="logo-badge">990</span><span class="logo-text">TOEIC 高分学习助手</span></span>
  <nav id="nav"></nav>
  <button id="themeBtn" title="切换深色 / 浅色模式">🌙</button>
</header>
<main>
  <div id="view"></div>
  <footer>TOEIC 高分学习助手 · 数据保存在本机浏览器（localStorage）· 目标：990 🎯</footer>
</main>
<script src="data_vocab.js"></script>
<script src="data_questions.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
